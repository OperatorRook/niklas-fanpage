<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werd schwul für Niklas ⚡ Official Hype Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyan: {
                            glow: '#00f3ff',
                            dark: '#008b94',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #03060f;
            color: #ffffff;
            overflow-x: hidden;
        }
        h1, h2, .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.3);
        }
        .neon-box {
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-cyan-glow selection:text-black">

    <!-- Header -->
    <header class="w-full max-w-xl text-center py-6">
        <h1 class="text-3xl md:text-5xl font-black uppercase tracking-wider text-cyan-glow neon-glow">
            Werd schwul für Niklas
        </h1>
        <p class="text-gray-400 tracking-widest uppercase text-xs md:text-sm mt-2">
            Minimalist Cyberpunk Hype-Meter v1.0
        </p>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md flex flex-col items-center my-auto">
        
        <!-- Bild zentriert mit Neon-Rahmen -->
        <div class="w-full flex justify-center items-center my-4">
            <img src="file_000000003a288230bb5983d03f80a834.png" alt="Niklas" class="w-48 h-48 md:w-60 md:h-60 object-cover rounded-2xl border-2 border-cyan-glow shadow-[0_0_25px_rgba(0,243,255,0.4)]">
        </div>

        <!-- Anzeigebereich für den Spruch -->
        <div class="h-12 flex items-center justify-center my-2 text-center">
            <p id="quote" class="text-cyan-glow font-bold text-lg md:text-xl italic neon-glow tracking-wide">
                Klicke den Button, um den Hype zu starten!
            </p>
        </div>

        <!-- Hype-Meter Display -->
        <div class="w-full neon-box bg-slate-900/80 backdrop-blur-md rounded-2xl p-6 text-center my-4">
            <span class="text-xs uppercase tracking-widest text-cyan-dark font-bold block mb-1">Aktueller Hype-Level</span>
            <div id="counter" class="text-6xl md:text-8xl font-black font-orbitron text-white neon-glow my-2">0</div>
            
            <!-- Click Button -->
            <button onclick="incrementHype()" class="w-full mt-6 py-4 px-6 bg-cyan-glow hover:bg-cyan-400 text-black font-black uppercase tracking-wider rounded-xl text-lg shadow-[0_0_20px_rgba(0,243,255,0.6)] transition-all transform active:scale-95 cursor-pointer">
                <i class="fa-solid fa-bolt mr-2"></i> Hype steigern!
            </button>
        </div>

        <!-- Reset Button -->
        <button onclick="resetHype()" class="text-xs text-gray-500 hover:text-red-400 uppercase tracking-widest transition-colors mt-2">
            <i class="fa-solid fa-rotate-right mr-1"></i> Reset Counter
        </button>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-gray-600 uppercase tracking-widest">
        Powered by GitHub Pages &bull; OperatorRook
    </footer>

    <!-- JavaScript für Zähler & Sprüche -->
    <script>
        const quotes = [
            "Niklas ist einfach unvergleichlich!",
            "100% Schwul für Niklas!",
            "Der Hype erreicht ein neues Level!",
            "Niemand kommt an Niklas ran!",
            "Mehr Hype geht gar nicht!",
            "Niklas = Legende!",
            "Absoluter Giga-Hype für Niklas!"
        ];

        let count = localStorage.getItem('niklas_hype_count');
        
        if (count === null) {
            count = 0;
        } else {
            count = parseInt(count);
        }

        const counterElement = document.getElementById('counter');
        const quoteElement = document.getElementById('quote');
        
        counterElement.innerText = count;

        function incrementHype() {
            count++;
            counterElement.innerText = count;
            localStorage.setItem('niklas_hype_count', count);

            // Zufälligen Spruch auswählen
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            quoteElement.innerText = randomQuote;
        }

        function resetHype() {
            if (confirm("Möchtest du den Hype-Zähler wirklich auf 0 zurücksetzen?")) {
                count = 0;
                counterElement.innerText = count;
                localStorage.setItem('niklas_hype_count', count);
                quoteElement.innerText = "Klicke den Button, um den Hype zu starten!";
            }
        }
    </script>
</body>
</html>
